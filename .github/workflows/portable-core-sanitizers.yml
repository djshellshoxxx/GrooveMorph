name: Portable core sanitizers

on:
  pull_request:
  push:
    branches:
      - main
      - 'claude/**'
      - 'codex/**'
      - 'qa/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-asan-ubsan:
    name: Core ASan + UBSan (Linux GCC)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v4
      - name: Configure instrumented portable core
        run: |
          cmake -S . -B build-sanitized \
            -DGROOVEMORPH_CORE_ONLY_BUILD=ON \
            -DBUILD_TESTING=ON \
            -DCMAKE_BUILD_TYPE=Debug \
            '-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all' \
            '-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined'
      - name: Build instrumented core and test binaries
        run: cmake --build build-sanitized --parallel 2
      - name: Run tests with sanitizer errors treated as failures
        run: ctest --test-dir build-sanitized --output-on-failure --parallel 1
