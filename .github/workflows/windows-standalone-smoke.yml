name: Windows Standalone smoke and artifact

on:
  push:
    branches:
      - main
      - 'integration/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-standalone-smoke:
    runs-on: windows-2022
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build Standalone
        run: cmake --build build --config Release --target GrooveMorphPlugin_Standalone --parallel 2
      - name: Launch Standalone and verify process remains alive
        shell: pwsh
        run: |
          $standalone = Join-Path $PWD 'build/GrooveMorphPlugin_artefacts/Release/Standalone/GrooveMorph.exe'
          if (-not (Test-Path $standalone)) {
            throw "Standalone executable not found: $standalone"
          }
          $process = $null
          try {
            $process = Start-Process -FilePath $standalone -PassThru
            Start-Sleep -Seconds 5
            $process.Refresh()
            if ($process.HasExited) {
              throw "Standalone exited during startup with code $($process.ExitCode)"
            }
          } finally {
            if ($null -ne $process -and -not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }
      - name: Upload Standalone artifact
        uses: actions/upload-artifact@v4
        with:
          name: GrooveMorph-Windows-Standalone
          path: build/GrooveMorphPlugin_artefacts/Release/Standalone/GrooveMorph.exe
          if-no-files-found: error
          retention-days: 30
