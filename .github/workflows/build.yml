name: Build and test

on:
  push:
    branches:
      - main
      - 'codex/**'
      - 'claude/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-tests:
    name: Portable core tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - name: Configure portable core
        run: cmake -S . -B build-core -DGROOVEMORPH_CORE_ONLY_BUILD=ON -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build portable core
        run: cmake --build build-core --config Release --parallel
      - name: Run portable core tests
        run: ctest --test-dir build-core --build-config Release --output-on-failure

  plugin-build:
    name: JUCE plugin and standalone (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux audio and GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libasound2-dev libjack-jackd2-dev libfreetype6-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxinerama-dev \
            libxrandr-dev libxext-dev libxrender-dev libgtk-3-dev
      - name: Configure plugin targets
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build VST3 and Standalone
        run: cmake --build build --config Release --parallel
      - name: Run core tests
        run: ctest --test-dir build --build-config Release --output-on-failure
      - name: Windows Standalone launch smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $standalone = Join-Path $PWD 'build/GrooveMorphPlugin_artefacts/Release/Standalone/GrooveMorph.exe'
          if (-not (Test-Path $standalone)) {
            throw "Standalone executable not found: $standalone"
          }
          $process = $null
          try {
            $process = Start-Process -FilePath $standalone -PassThru
            Start-Sleep -Seconds 5
            $process.Refresh()
            if ($process.HasExited) {
              throw "Standalone exited during startup with code $($process.ExitCode)"
            }
            Write-Host "Standalone process remained alive for five seconds."
          } finally {
            if ($null -ne $process -and -not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }
      - name: Upload Windows Standalone build
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: GrooveMorph-Windows-Standalone
          path: build/GrooveMorphPlugin_artefacts/Release/Standalone/GrooveMorph.exe
          if-no-files-found: error
          retention-days: 30
