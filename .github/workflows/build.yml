name: Build and test

on:
  push:
    branches:
      - main
      - 'codex/**'
      - 'claude/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-tests:
    name: Portable core tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - name: Configure portable core
        run: cmake -S . -B build-core -DGROOVEMORPH_CORE_ONLY_BUILD=ON -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build portable core
        run: cmake --build build-core --config Release --parallel
      - name: Run portable core tests
        run: ctest --test-dir build-core --build-config Release --output-on-failure --parallel 2

  plugin-build:
    name: JUCE plugin and standalone (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux audio and GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libasound2-dev libjack-jackd2-dev libfreetype6-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxinerama-dev \
            libxrandr-dev libxext-dev libxrender-dev libgtk-3-dev
      # Cache only the fetched JUCE dependency, not built plugin outputs. The OS
      # key isolates platform-specific FetchContent build metadata.
      - name: Restore JUCE FetchContent cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.juce-fetch
          key: juce-fetch-${{ runner.os }}-8.0.7-v1
      - name: Configure plugin targets
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DFETCHCONTENT_BASE_DIR="${{ github.workspace }}/.juce-fetch"
      - name: Build VST3 and Standalone
        run: cmake --build build --config Release --parallel
      - name: Run core tests
        run: ctest --test-dir build --build-config Release --output-on-failure --parallel 2
